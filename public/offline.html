<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>MIRA — Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #F8F9FB; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #0F172A; padding: 24px; box-sizing: border-box; }
  .card { max-width: 340px; text-align: center; }
  .logo { font-weight: 800; font-size: 28px; letter-spacing: -1px; color: #2D4BFF; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #64748B; font-size: 15px; line-height: 1.6; margin: 0 0 22px; }
  button { background: #2D4BFF; color: #fff; border: 0; border-radius: 999px; padding: 13px 26px; font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">MIRA</div>
    <h1>Kamu lagi offline</h1>
    <p>MIRA butuh internet buat nyatet dan nampilin data keuanganmu. Cek koneksi, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
