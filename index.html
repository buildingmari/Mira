<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MIRA AI – Catat Keuangan & Pengeluaran via WhatsApp Simple & Otomatis</title>
    <meta name="description" content=" Catat keuangan cukup lewat WhatsApp. MIRA AI bantu track keuangan, laporan Excel otomatis, dan kontrol pengeluaran harian tanpa ribet. />
    <meta property="og:title" content=" MIRA AI – Catat Keuangan & Pengeluaran via WhatsApp | Simple & Otomatis" />
    <meta property="og:description" content="Kelola keuangan pribadimu dengan lebih cerdas bersama MIRA." />
    <meta property="og:image" content="" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var SUPA_URL = 'https://vhwissutkmxyzlyzkhyt.supabase.co';
        var SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZod2lzc3V0a214eXpseXpraHl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0ODIxMTksImV4cCI6MjA4NzA1ODExOX0.pKVqCkDv8bsaMCPJSsjFx0pYTVN5FPg0KFyoKz4kLM0';
        fetch(SUPA_URL + '/rest/v1/site_settings?select=site_title,meta_description,og_title,og_description,og_image,favicon_url&limit=1', {
          headers: { 'apikey': SUPA_ANON, 'Authorization': 'Bearer ' + SUPA_ANON }
        })
        .then(function (r) { return r.json(); })
        .then(function (rows) {
          if (!Array.isArray(rows) || !rows.length) return;
          var s = rows[0];
          if (s.site_title) document.title = s.site_title;
          var desc = document.querySelector('meta[name="description"]');
          if (!desc) { desc = document.createElement('meta'); desc.name = 'description'; document.head.appendChild(desc); }
          if (s.meta_description) desc.setAttribute('content', s.meta_description);
          var ogProps = { 'og:title': 'og_title', 'og:description': 'og_description', 'og:image': 'og_image' };
          Object.keys(ogProps).forEach(function (prop) {
            var val = s[ogProps[prop]];
            if (!val) return;
            var el = document.querySelector('meta[property="' + prop + '"]');
            if (!el) { el = document.createElement('meta'); el.setAttribute('property', prop); document.head.appendChild(el); }
            el.setAttribute('content', val);
          });
          if (s.favicon_url) {
            var link = document.querySelector('link[rel="icon"]');
            if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
            link.href = s.favicon_url;
          }
        })
        .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
