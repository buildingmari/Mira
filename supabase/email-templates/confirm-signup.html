<!-- Supabase → Authentication → Emails → "Confirm signup". Subject: Konfirmasi email akun MIRA kamu -->
<div style="background:#F4F6FF;padding:32px 16px;font-family:'Helvetica Neue',Arial,sans-serif;color:#0F172A">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:20px;padding:32px 28px;box-shadow:0 8px 30px rgba(45,75,255,.08)">
    <div style="font-weight:800;font-size:24px;letter-spacing:-0.5px;color:#2D4BFF;margin-bottom:20px">MIRA</div>
    <h1 style="font-size:20px;line-height:1.35;margin:0 0 10px">Satu klik lagi, akunmu siap</h1>
    <p style="font-size:15px;line-height:1.6;color:#475569;margin:0 0 24px">
      Konfirmasi email <strong>{{ .Email }}</strong> buat lanjut daftar MIRA — asisten keuangan yang bantu catat pengeluaranmu otomatis.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2D4BFF;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 26px;border-radius:999px">Konfirmasi email</a>
    <p style="font-size:13px;line-height:1.6;color:#94A3B8;margin:24px 0 0">
      Link ini cuma berlaku sebentar. Kalau kamu nggak merasa daftar MIRA, abaikan aja email ini.
    </p>
  </div>
  <p style="text-align:center;font-size:12px;color:#94A3B8;margin:18px 0 0">MIRA · halo-mira.com</p>
</div>
